databases:
  - name: importfile-db
    plan: free
    databaseName: importfile
    user: importfile

services:
  - type: web
    name: importfile-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate --schema=server/prisma/schema.prisma && npm run build -w server
    startCommand: npx prisma migrate deploy --schema=server/prisma/schema.prisma && node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: importfile-db
          property: connectionString
