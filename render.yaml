databases:
  - name: importfile-db
    plan: free
    databaseName: importfile
    user: importfile

services:
  - type: web
    name: importfile-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: importfile-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://importfile-frontend.onrender.com

  - type: web
    name: importfile-frontend
    runtime: static
    buildCommand: npm ci && npm run build -w client
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://importfile-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
